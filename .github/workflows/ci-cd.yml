name: ObRail CI/CD

on:
  push:
    branches: [main, fix-correctif]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_NAME: obrail
  DB_USER: obrail_user
  DB_PASSWORD: ci_password
  JWT_SECRET: ci_only_secret
  ADMIN_SIGNUP_CODE: "654321"
  COOKIE_SECURE: "false"
  E2E_ADMIN_CODE: "654321"

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true


jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platform/server/requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      - name: Run unit tests
        run: python -m pytest -v platform/server/test/unit

      - name: Run integration tests
        run: python -m pytest -v platform/server/test/integration/api_db

      - name: Run E2E tests
        run: python -m pytest -v platform/server/test/E2E

  ia-tests:
    name: IA Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:platform/server
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.ia-test.txt

      - name: Install IA test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.ia-test.txt

      - name: Check IA syntax and imports
        run: |
          python -m compileall -q ia/src platform/server/app/routers/predict.py
          python -c "from ia.src.ml import build_dataset, train_forecasting, predict, validate_artifacts; from app.routers import predict as predict_router"

      - name: Run IA tests with coverage
        run: >-
          python -m pytest ia/tests -v
          --cov=ia.src.ml.build_dataset
          --cov=ia.src.ml.train_forecasting
          --cov=ia.src.ml.predict
          --cov=ia.src.ml.validate_artifacts
          --cov-report=term-missing

  frontend-tests:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/front/app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: platform/front/app

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: platform/front/app

      - name: Start docker services for E2E
        run: |
          set -euo pipefail

          if ! docker compose up -d db prometheus loki grafana; then
            set +e
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

          if ! docker compose up -d --build --no-deps api; then
            set +e
            docker compose ps
            docker compose logs api --tail=200
            exit 1
          fi

          if ! docker compose up -d --build --no-deps front; then
            set +e
            docker compose ps
            docker compose logs api front --tail=200
            exit 1
          fi

      - name: Wait for frontend and API
        run: |
          for i in {1..60}; do
            docker compose exec -T db pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null \
              && curl -fsS http://localhost:3000/externe/HomePage >/dev/null \
              && curl -fsS http://localhost:8000/health >/dev/null \
              && curl -fsS http://localhost:8000/api/docs >/dev/null \
              && exit 0
            sleep 5
          done
          echo "Services not ready in time"
          set +e
          docker compose ps
          docker compose logs api front --tail=200
          exit 1

      - name: Run Playwright E2E
        run: npm run e2e
        working-directory: platform/front/app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/front/app/playwright-report
          if-no-files-found: ignore

      - name: Stop docker services
        if: always()
        run: docker compose down -v

        


  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/server/requirements.txt

      - name: Run Flake8
        run: |
          pip install flake8
          flake8 platform/server/app --max-line-length=120 --ignore=E501,W503 --count

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/front/app/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: platform/front/app

      - name: Run ESLint
        run: npx eslint src --ext .js,.jsx --max-warnings=50
        working-directory: platform/front/app

      - name: Run Prettier (advisory)
        run: npx prettier --check src
        working-directory: platform/front/app
        continue-on-error: true



  ml-pipeline-validation:
    name: ML Pipeline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ETL and ML pipeline with Docker Compose
        run: |
          set -euo pipefail
          docker compose up --build -d ia

          set +e
          docker compose wait ia
          WAIT_EXIT_CODE=$?
          set -e

          IA_EXIT_CODE=$(docker inspect obrail_ia --format='{{.State.ExitCode}}')
          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$IA_EXIT_CODE" -ne 0 ]; then
            echo "IA pipeline failed (wait=$WAIT_EXIT_CODE, container=$IA_EXIT_CODE)"
            exit 1
          fi

      - name: Validate generated artifacts
        run: >-
          docker compose run --rm --no-deps ia
          python -m ia.src.ml.validate_artifacts

      - name: Show pipeline logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=300 db etl ia

      - name: Stop ML pipeline services
        if: always()
        run: docker compose down -v



  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-tests
      - ia-tests
      - frontend-tests
      - code-quality
      - ml-pipeline-validation
    if: >-
      always() &&
      needs.backend-tests.result == 'success' &&
      needs.ia-tests.result == 'success' &&
      needs.frontend-tests.result == 'success' &&
      needs.code-quality.result == 'success' &&
      needs.ml-pipeline-validation.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build



  docker-push:
    name: Docker Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for SERVICE in front api etl ia; do
            IMAGE_ID=$(docker compose images -q "$SERVICE" | head -1)
            if [ -z "$IMAGE_ID" ]; then
              echo "ERROR: image missing for Compose service '$SERVICE'"
              docker compose images
              exit 1
            fi

            TARGET="ghcr.io/$OWNER/mspr_1_b3-$SERVICE:latest"
            docker tag "$IMAGE_ID" "$TARGET"
            docker push "$TARGET"
          done


  container-smoke-test:
    name: Container Smoke Test
    needs: [docker-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published application images
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for SERVICE in front api etl ia; do
            TARGET="ghcr.io/$OWNER/mspr_1_b3-$SERVICE:latest"
            LOCAL_IMAGE=$(docker compose config --images | grep -E -- "-${SERVICE}$")

            if [ -z "$LOCAL_IMAGE" ]; then
              echo "ERROR: local Compose image name missing for '$SERVICE'"
              exit 1
            fi

            docker pull "$TARGET"
            docker tag "$TARGET" "$LOCAL_IMAGE"
          done

      - name: Start essential local services
        run: |
          set -euo pipefail
          docker compose up -d --no-build db prometheus loki grafana
          docker compose up -d --no-build --no-deps api
          docker compose up -d --no-build --no-deps front

      - name: Check containers and endpoints
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if docker compose exec -T db pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null \
              && curl -fsS http://localhost:8000/health >/dev/null \
              && curl -fsS http://localhost:8000/api/docs >/dev/null \
              && curl -fsS http://localhost:3000/externe/HomePage >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done

          echo "Essential services did not become ready in time"
          docker compose ps -a
          docker compose logs --tail=200 db api front
          exit 1

      - name: Stop local services
        if: always()
        run: docker compose down -v
